name: Временная проверка доменов (pages-health-check)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - run: gem install github-pages-health-check --no-document
      - name: Проверка кодом GitHub Pages
        run: |
          cat > probe.rb <<'RUBY'
          require "github-pages-health-check"
          %w[sloty.veridok.ru pbcontrol.veridok.ru dokaai.ru flappylesha.ru docs.dobry-kot.ru password.hyoo.ru].each do |d|
            dom = GitHubPages::HealthCheck::Domain.new(d)
            h = dom.to_hash rescue { error: $!.class.name + ": " + $!.message }
            keep = %i[dns_resolves is_valid reason is_https_eligible caa_error is_cname_to_github_user_domain]
            puts "== #{d}"
            %w[dns_resolves? valid? https_eligible? cname_to_github_user_domain?].each { |m| v = (dom.public_send(m) rescue "#{$!.class}: #{$!.message}"); puts "  #{m} #{v.inspect}" }
            puts "  reason: #{(dom.reason rescue $!).inspect[0,300]}"
            begin
              caa = dom.send(:caa)
              puts "  caa.errored?: #{caa.errored?.inspect}  caa.error: #{caa.error.inspect}"
            rescue => e
              puts "  caa: #{e.class}: #{e.message}"
            end
          end
          RUBY
          ruby probe.rb
      - name: dig с раннера
        run: |
          sudo apt-get install -y -qq dnsutils >/dev/null
          for ns in ns1.reg.ru ns2.reg.ru; do
            echo "== @$ns"
            dig +norecurse +time=3 +tries=1 @$ns sloty.veridok.ru A | grep -E "status|ANSWER SECTION|Query time|timed out" || true
            dig +norecurse +time=3 +tries=1 @$ns sloty.veridok.ru CAA | grep -E "status|Query time|timed out" || true
            dig +norecurse +time=3 +tries=1 +tcp @$ns sloty.veridok.ru CAA | grep -E "status|Query time|timed out" || true
          done
          echo "== system resolver"; dig sloty.veridok.ru CAA | grep -E "status|Query time"
          echo "== trace"; dig +trace sloty.veridok.ru A | tail -n 15
